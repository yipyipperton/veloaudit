name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: velo, POSTGRES_PASSWORD: velo, POSTGRES_DB: veloaudit }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://velo:velo@localhost:5432/veloaudit?schema=public
      TEST_DATABASE_URL: postgresql://velo:velo@localhost:5432/veloaudit_test?schema=public
      REDIS_URL: redis://localhost:6379
      PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: bash scripts/ci-steps.sh
